name: PoC - MedAccess Core Libs Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch: # Added this so you can trigger the PoC manually from the UI!

jobs:
  build-and-test:
    # [PoC MODE]: Using a standard cloud runner for now.
    # [FUTURE STATE]: Change this to `runs-on: medaccess-dev-runner` once ARC is ready.
    runs-on: ubuntu-latest 
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Custom Git Tag & Env Setup
        run: |
          git tag -l | xargs git tag -d || echo "No tags to delete"
          git fetch --tags --force

          git rev-parse HEAD > .git/commit-id
          echo "GIT_COMMIT=$(cat .git/commit-id)" >> $GITHUB_ENV
          echo "GIT_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          
          git tag

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Verify Tools
        run: |
          java -version
          ./gradlew --version

      - name: Compile and Test
        run: ./gradlew --info --stacktrace clean build

      # [PoC MODE]: We must manually set up Java 11 because we don't have the baked image yet.
      # [FUTURE STATE]: You can delete this entire step later, as `mise` will inject Corretto 11.
      - name: MOCK RUNNER TOOLING - Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Verify Tools
        run: |
          java -version
          ./gradlew --version

      - name: Compile and Test
        # Legacy Artifactory is bypassed. We just build.
        run: ./gradlew --info --stacktrace clean build

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 25

      # [PoC MODE]: Capturing the JARs to prove the build succeeded.
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries
          path: |
            **/build/libs/*.jar
          retention-days: 5

      - name: Workspace Cleanup
        if: always()
        run: |
          rm -rf ${{ github.workspace }}/* || true
          rm -rf ${{ github.workspace }}/.* || true

name: Build MedAccess Core Libs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Best Practice: Explicitly define minimal permissions
permissions:
  contents: read

jobs:
  build:
    name: Build and Test Core Libs
    # Replace with your actual ARC runner scale set name from your consumer config
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # CRITICAL: Your Jenkinsfile noted that the build depends on accurate tags.
          # Setting fetch-depth to 0 fetches all history for all branches and tags.
          fetch-depth: 0 

      - name: Set up JDK 11 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto' # Matching the tool from your Jenkinsfile
          cache: 'gradle'          # Built-in Gradle caching for faster subsequent runs

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        # Note: 'artifactoryPublish' is intentionally omitted per your Phase 1 requirements.
        # We are only verifying that the project compiles and tests pass successfully.
        run: ./gradlew --info --stacktrace clean build

      - name: Archive Test Results
        if: always() # Run this step even if the build/tests fail
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          # Matching the glob pattern from your Jenkinsfile 'junit' step
          path: '**/build/test-results/**/*.xml' 
          retention-days: 7

      - name: Archive JAR Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: medaccess-core-libs-jars
          path: '**/build/libs/*.jar'
          retention-days: 1 # Short retention since we aren't publishing yet
